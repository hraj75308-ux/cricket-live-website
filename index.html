
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Live Score</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
}

header {
  background: linear-gradient(120deg,#087f5b,#064e3b);
  padding: 24px 16px;
  text-align: center;
}

header h1 { margin: 0; font-size: 28px; }
header p { color: #d1fae5; }

nav {
  background: #101e30;
  padding: 14px;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 12px;
}

main {
  max-width: 900px;
  margin: 25px auto;
  padding: 0 15px;
}

.section-title {
  color: #86efac;
  font-size: 22px;
}

.match {
  background: #14243a;
  border: 1px solid #29415d;
  border-radius: 14px;
  padding: 18px;
  margin: 16px 0;
}

.match h2 { font-size: 19px; }

.score {
  background: #0b192b;
  padding: 13px;
  margin: 10px 0;
  border-radius: 9px;
}

.score strong { color: #86efac; }

.status {
  color: #facc15;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 25px;
  color: #94a3b8;
}
</style>
</head>

<body>

<header>
  <h1>🏏 CRICKET LIVE SCORE</h1>
  <p>Live Cricket Updates Around The World</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#matches">Matches</a>
  <a href="#about">About</a>
</nav>

<main id="matches">
  <h2 class="section-title">🔥 Cricket Matches</h2>
  <div id="match-list">Loading matches...</div>
</main>

<footer id="about">
  Made with ❤️ for Cricket Fans
</footer>

<script>
const API_URL = "PASTE_YOUR_API_URL_HERE";

async function loadMatches() {
  const box = document.getElementById("match-list");

  try {
    if (API_URL.includes("PASTE_YOUR")) {
      box.textContent = "API connection will be added soon!";
      return;
    }

    const response = await fetch(API_URL);
    const result = await response.json();

    if (!response.ok || result.status !== "success") {
      throw new Error("API error");
    }

    const matches = result.data || [];

    box.innerHTML = matches.map(match => {
      const teams = (match.teams || []).join(" vs ");

      const scores = (match.score || []).map(s => `
        <div class="score">
          ${s.inning || "Innings"}:
          <strong>${s.r ?? 0}/${s.w ?? 0}</strong>
          (${s.o ?? 0} overs)
        </div>
      `).join("");

      return `
        <article class="match">
          <h2>${teams || "Cricket Match"}</h2>
          ${scores}
          <p class="status">${match.status || "Match status unavailable"}</p>
          <p>📍 ${match.venue || "Venue unavailable"}</p>
        </article>
      `;
    }).join("") || "No matches available";

  } catch (error) {
    box.textContent = "Matches load nahi hue. API connection check karo.";
  }
}

loadMatches();
setInterval(loadMatches, 30000);
</script>

</body>
</html>
